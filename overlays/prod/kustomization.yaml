apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# =============================================================================
# BASE
# =============================================================================
helmGlobals:
  chartHome: ../../base/charts

helmCharts:
  - name: mychart
    releaseName: mychart
    # Local values override
    valuesFile: values-prod.yaml
    # Inline values override
    valuesInline:
      replicaCount: 5

# =============================================================================
# ADDITIONAL RESOURCES
# =============================================================================
resources:
  - configmap.yaml

# =============================================================================
# PATCHES
# =============================================================================
patches:
  - target:
      kind: Service
      name: mychart
    patch: |-
      - op: replace
        path: /spec/ports/0/targetPort
        value: 8080
        