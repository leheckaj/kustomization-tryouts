apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# =============================================================================
# BASE
# =============================================================================
resources:
  - ../../base

# =============================================================================
# ADDITIONAL RESOURCES
# =============================================================================
  - configmap.yaml
  - extra-chart

# =============================================================================
# PATCHES
# =============================================================================
patches:
  - target:
      kind: Deployment
      name: mychart
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5

  - target:
      kind: Service
      name: mychart
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer

  - target:
      kind: Service
      name: mychart
    patch: |-
      - op: replace
        path: /spec/ports/0/targetPort
        value: 8080
